    <script>
        window.earthquakeCountData = {};

        document.addEventListener('DOMContentLoaded', function() {
            fetch('202611021323_earthquake_count_data.json')
                .then(response => response.json())
                .then(data => {
                    window.earthquakeCountData = data;
                    console.log("地震回数データJSONの読み込みが完了しました。");
                })
                .catch(error => console.error("JSONの読み込みに失敗しました:", error));

            var mapObj = null;
            for (var key in window) {
                if (key.startsWith('map_') && window[key] instanceof L.Map) {
                    mapObj = window[key];
                    break;
                }
            }

            if (mapObj) {
                mapObj.on('popupopen', function(e) {
                    var popup = e.popup;
                    var popupDiv = popup.getElement().querySelector('[data-mesh]');
                    if (popupDiv) {
                        var meshKey = popupDiv.getAttribute('data-mesh');
                        var row = window.earthquakeCountData[meshKey];
                        if (row) {
                            var parts = meshKey.split('_');
                            var lat = parts[0];
                            var lon = parts[1];
                            var textColor = row.text_color || "#333333";
                            var regionsSummary = row.regions_summary ? row.regions_summary : "なし";

                            popupDiv.innerHTML = `
                            <div class="p-box">
                                <div class="p-header">
                                    <span>${lat}_${lon}</span>
                                    <span style="color: ${textColor}; font-weight: bold;">【${row.count}回】</span>
                                </div>
                                <div class="p-label" style="margin-bottom: 2px;">震央地名サマリー:</div>
                                <div class="p-text" style="margin-bottom: 6px;">${regionsSummary}</div>
                                <div style="font-weight: bold; margin-bottom: 2px; color: #0055FF;">🔍 地震履歴（直近3件）</div>
                                <ul style="padding-left: 8px; margin: 0; list-style: none;">
                                    ${row.visible_history}
                                </ul>
                                ${row.more_history}
                            </div>`;
                        }
                    }

                    setTimeout(function() {
                        popup.update();
                    }, 50);
                });
            }

            document.getElementById('mesh-opacity').addEventListener('input', function() {
                var opacity = parseFloat(this.value);
                document.getElementById('opacity-val').textContent = opacity.toFixed(2);
                document.querySelectorAll('path.mesh-rectangle').forEach(function(path) {
                    path.setAttribute('fill-opacity', opacity);
                });
            });

            document.getElementById('text-size').addEventListener('input', function() {
                var size = parseInt(this.value, 10);
